<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root { --region-bottom: {{.RegionH}}px; }
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
.clip-key { position: absolute; right: 24px; bottom: calc(100vh - var(--region-bottom) + 24px); min-width: 1.6em; text-align: center; font: 600 30px/1.25 system-ui,-apple-system,sans-serif; color: #fff; background: rgba(10,10,14,0.72); border-radius: 12px; padding: 10px 18px; }
</style>
</head><body><div class="clip-key">{{.Text}}</div></body></html>
