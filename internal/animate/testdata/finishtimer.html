<!doctype html>
<style>body { margin: 0; } div { width: 40px; height: 40px; }</style>
<div id="a"></div><div id="b"></div>
<script>
  document.getElementById("a").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500 }).finished.then(() => {
    setTimeout(() => {
      document.getElementById("b").animate([{ transform: "translateX(0)" }, { transform: "translateX(100px)" }],
        { duration: 1000, fill: "forwards" });
    }, 0);
  });
</script>
