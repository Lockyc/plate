<!doctype html>
<style>body { margin: 0; background: #000; } video { display: block; width: 320px; height: 240px; }</style>
<script>
  setTimeout(() => {
    const v = document.createElement("video");
    v.id = "v";
    v.muted = true;
    v.preload = "auto";
    v.src = new URLSearchParams(location.search).get("src") || "source.mp4";
    document.body.append(v);
  }, 1000);
</script>
