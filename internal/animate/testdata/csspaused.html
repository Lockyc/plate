<!doctype html>
<style>
  body { margin: 0; }
  #b { width: 40px; height: 40px; background: #c33; animation: slide 2s linear forwards paused; }
  #b.go { animation-play-state: running; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(500px); } }
</style>
<div id="b"></div>
<script>setTimeout(() => document.getElementById("b").classList.add("go"), 1000);</script>
