name    = "plate"
summary = "Go CLI that makes or inspects visual artefacts for print and web pipelines: cutout, inpaint, infill, upscale, colour grade, HTML→PNG/PDF render, markdown→PDF, press-ready PDF, diff, font embed, QR — pinned engines, measured quality"
kind    = "tool"
status  = "active"
tags    = ["images", "print", "render", "cli", "pipelines"]
stack   = ["go", "python"]

[github]
topics_extra = ["cli", "golang", "image-processing", "imagemagick", "headless-chrome", "ghostscript", "background-removal", "print"]

[[provides]]
name    = "image-render-ops"
summary = "go-installable `plate` binary: subject cutout to RGBA (Vision/BiRefNet + tiled ViTMatte), LaMa inpaint, blur-pyramid infill, DAT super-resolution upscale, HALD grade fit/apply, guarded headless-Chrome HTML→PNG/PDF, outlined-CMYK press PDF with soft-proof gate, aligned image diff, font data-URI CSS, QR SVG; `plate.toml` can forbid the pixel-synthesising ops"
url     = "https://github.com/lockyc/plate"

[[provides]]
name    = "web-screenshot"
summary = "Screenshot a web page or localhost app by URL at a set viewport: `plate render --png out.png --size WxH --budget MS <URL>` on pinned chrome-headless-shell"
url     = "https://github.com/lockyc/plate"

[[provides]]
name    = "pdf-read-write"
summary = "Read PDFs (`plate pdf info|text|pages|images`: metadata with a text-layer check, layout text, page renders, embedded images) and produce them from markdown or HTML with a document stylesheet (`plate doc`)"
url     = "https://github.com/lockyc/plate"
