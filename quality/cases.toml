# animate: a page's own animation, captured on plate's clock. Each case's
# page is written into the case directory.

[[case]]
name   = "animate-deterministic"
why    = "two captures of one CSS-animated page must be the same frame for frame: the clock, not wall time, drives the page"
run    = ["animate", "--size", "320x240", "--duration", "2", "--format", "mp4", "--out", "{tmp:out1}", "--name", "a", "{tmp:page.html}"]
post   = [
  ["plate", "animate", "--size", "320x240", "--duration", "2", "--format", "mp4", "--out", "{tmp:out2}", "--name", "a", "{tmp:page.html}"],
  ["ffmpeg", "-i", "{tmp:out1/a.mp4}", "-vf", 'select=eq(n\,45)', "-frames:v", "1", "{tmp:f1.png}"],
  ["ffmpeg", "-i", "{tmp:out2/a.mp4}", "-vf", 'select=eq(n\,45)', "-frames:v", "1", "{tmp:f2.png}"],
]
metric = "rmse"
params = { a = "{tmp:f1.png}", b = "{tmp:f2.png}" }
max    = 0

[case.files]
"page.html" = '''
<!doctype html>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #101830; overflow: hidden; }
.b { position: absolute; top: 80px; left: 0; width: 80px; height: 80px; background: #ffd400;
     animation: go 2s linear infinite, spin 1.3s linear infinite; }
@keyframes go { from { left: 0 } to { left: 240px } }
@keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
</style>
<div class="b"></div>
'''

[[case]]
name   = "animate-text-sharp"
why    = "thin coloured text scrolling at 120 px/s must keep its strokes through the mp4 and webm encodes of a 1080x1920 capture (sharpness 0.995944)"
run    = ["animate", "--size", "1080x1920", "--duration", "4", "--format", "mp4,webm", "--out", "{tmp:out}", "--name", "text", "{tmp:page.html}"]
metric = "json"
params = { file = "{tmp:out/text.json}", field = "sharpness" }
min    = 0.995

[case.files]
"page.html" = '''
<!doctype html>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #0a0a12; overflow: hidden; }
#s { animation: scroll 4s linear forwards; font: 300 14px/20px sans-serif; padding: 20px; white-space: nowrap; }
@keyframes scroll { from { transform: translateY(0) } to { transform: translateY(-480px) } }
.c { color: #00e5ff; } .m { color: #ff2bd6; } .g { color: #39ff14; } .y { color: #ffd400; }
</style>
<div id="s"></div>
<script>
const cls = ["c", "m", "g", "y"];
let h = "";
for (let i = 0; i < 100; i++) {
  h += '<div><span class="' + cls[i % 4] + '">Plan garden seeds tasks done ' + i + '</span> <span class="' + cls[(i + 1) % 4] + '">thin text keeps its strokes</span> <span class="' + cls[(i + 2) % 4] + '">legible</span></div>';
}
document.getElementById("s").innerHTML = h;
</script>
'''

