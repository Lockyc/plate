# clip-sharp-neutral-beside-cyan: the same follow at 600 px, where the white
# code cells give the red channel its detail and 4:2:0 adds red at the cyan
# box's edges. A lossless 4:2:0 copy of such a frame scores below
# MinSharpness against the composed frame; against the 4:2:0 reference
# Sharpness takes, only the encoder's loss counts.

[[case]]
name   = "clip-sharp-neutral-beside-cyan"
why    = "neutral detail beside a saturated edge must not be refused for what 4:2:0 itself loses: the sharpness check scores the encoder"
setup  = [
  ["ffmpeg", "-f", "lavfi", "-i", "color=c=0x0a0a12:s=1206x2622:r=60:d=6", "-f", "lavfi", "-i", "color=c=0x00e5ff:s=300x300:r=60:d=6", "-filter_complex", "[0]geq=lum='if(lt(Y,80),if(mod(floor(N/pow(2,floor(X/100.5))),2),235,16),lum(X,Y))':cb=128:cr=128[bg];[bg][1]overlay=x='200+100*sin(t)':y=1200:format=rgb", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
metric = "json"
params = { file = "{tmp:out/code.json}", field = "sharpness" }
min    = 0.928

