# clip-text-scroll-*: the same capture scrolling 5.2 px a frame for 3 s, so
# every frame is new to the encoder. The trim starts at 0 and the camera
# frames the region at zoom 1, so output frame 60 is master frame 60's
# region, before the loop's crossfade.

[[case]]
name   = "clip-text-scroll-mp4-bytes"
why    = "the mp4's settings must hold the bytes a plain crf 18 wrote on moving text, so a clip under its budget stays under it"
setup  = [
  ["plate", "render", "--png", "{tmp:text.png}", "--size", "402x874", "--scale", "3", "{asset:clip-text.html}"],
  ["ffmpeg", "-loop", "1", "-framerate", "60", "-t", "3", "-i", "{tmp:text.png}", "-vf", "scroll=v=0.002", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
metric = "json"
params = { file = "{tmp:out/text.json}", field = "formats.mp4.bytes" }
max    = 857000

