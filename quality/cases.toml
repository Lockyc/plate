# clip loop: a pale square slides 300 px/s across the dark ground for the
# whole 3 s master, so its last frame is far from its first. Its body sets
# video.MaxSeam (the derivation is MaxSeam's docblock), and the seam bound
# below is that bound rounded toward failing.

[[case]]
name   = "clip-loop-crossfade"
why    = "a clip that ends away from where it began must crossfade its loop, leaving a cut no bigger than its own motion"
setup  = [
  ["ffmpeg", "-f", "lavfi", "-i", "color=c=0x0a0a12:s=1206x2622:r=60:d=3", "-f", "lavfi", "-i", "color=c=0xe8e8f0:s=300x300:r=60:d=3", "-filter_complex", "[0][1]overlay=x='100+300*t':y=1200:format=rgb", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
metric = "json"
params = { file = "{tmp:out/square.json}", field = "loop_seam" }
max    = 0.200

