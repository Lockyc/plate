# clip-idle-compress: the pale square slides right from 0.5 to 1.0 s and
# back from 3.5 to 4.0 s, a tap starting each slide; between them the
# screen is still but for a caret, iOS's 2 x 22 pt at 3x, blinking half a
# second on and half off. That 2.5 s gap, less max_idle_ms (500), is the
# time a render should drop: 2000 ms, less up to three frames (50 ms) for
# where the activity edges and the frame grid fall. A caret counted as
# activity would drop nothing.

[[case]]
name   = "clip-idle-compress"
why    = "dead screen between steps must shrink to max_idle_ms, a blinking caret included: it only makes the clip longer"
setup  = [
  ["ffmpeg", "-f", "lavfi", "-i", "color=c=0x0a0a12:s=1206x2622:r=60:d=5", "-f", "lavfi", "-i", "color=c=0xe8e8f0:s=300x300:r=60:d=5", "-filter_complex", "[0][1]overlay=x='100+600*clip(t-0.5,0,0.5)-600*clip(t-3.5,0,0.5)':y=1200:format=rgb,drawbox=x=600:y=600:w=6:h=66:color=white:t=fill:enable='between(t,1,3.5)*lt(mod(t,1),0.5)'", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
metric = "json"
params = { file = "{tmp:out/square.json}", field = "removed_ms" }
min    = 1950
max    = 2000

