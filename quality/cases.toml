# clip motion: a master whose top 80 px (26.67 pt) carry the frame number
# N as a 12-cell binary code (cell i, 100.5 px wide, white for bit i),
# over a cyan box swinging sideways, 6 s at 60 fps, lossless RGB. The strip
# is a camera pin, so every frame of the clip shows a master frame's code;
# frame-code counts the duplicates and drops render adds against the master
# decoded passthrough. The output frame is 1080x2420: the strip, 72 px,
# over the region's 2348 px slot, so the strip's centre row sits at 0.0148
# of the frame's height.

[[case]]
name   = "clip-follow-frame-steps"
why    = "a follow clip must show each master frame once, in order: a dropped or doubled frame stutters"
setup  = [
  ["ffmpeg", "-f", "lavfi", "-i", "color=c=0x0a0a12:s=1206x2622:r=60:d=6", "-f", "lavfi", "-i", "color=c=0x00e5ff:s=300x300:r=60:d=6", "-filter_complex", "[0]geq=lum='if(lt(Y,80),if(mod(floor(N/pow(2,floor(X/100.5))),2),235,16),lum(X,Y))':cb=128:cr=128[bg];[bg][1]overlay=x='200+100*sin(t)':y=1200:format=rgb", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
post   = [
  ["ffmpeg", "-i", "{tmp:out/code.mp4}", "-vf", "scale=in_color_matrix=bt709:in_range=auto:flags=accurate_rnd+full_chroma_int+bilinear,format=rgb24", "-fps_mode", "passthrough", "{tmp:f%05d.png}"],
  ["ffmpeg", "-i", "{tmp:master.mov}", "-fps_mode", "passthrough", "{tmp:m%05d.png}"],
]
metric = "frame-code"
params = { frames = "{tmp:f*.png}", master = "{tmp:m*.png}", sidecar = "{tmp:out/code.json}", y = 0.0148, master_y = 0.0153 }
max    = 0

