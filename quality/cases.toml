# clip-loop-dip: the pale square rests on the left, slides right from 1 to
# 2 s and rests there: an end state that differs from the start, as a row
# moved by an added node does. a and b are the square's start and end
# places, inset, in the 600x1304 frame; double-exposure is how strongly
# any frame shows both. A blend of end and start shows each at its weight,
# 0.41 mid-crossfade against the square's full 0.87, so the metric tells a
# blend from a dip by two orders of magnitude. The bound is the dip's
# measured 0.00506 rounded toward failing.

[[case]]
name   = "clip-loop-dip"
why    = "a dipped loop must never show the end and the start in one frame: overlaid, a moved row reads as two"
setup  = [
  ["ffmpeg", "-f", "lavfi", "-i", "color=c=0x0a0a12:s=1206x2622:r=60:d=3", "-f", "lavfi", "-i", "color=c=0xe8e8f0:s=300x300:r=60:d=3", "-filter_complex", "[0][1]overlay=x='100+600*clip(t-1,0,1)':y=1200:format=rgb", "-c:v", "png", "{tmp:master.mov}"],
]
run    = ["clip", "render", "--script", "{tmp:clip.toml}", "--master", "{tmp:master.mov}", "--events", "{tmp:events.jsonl}", "--out", "{tmp:out}"]
post   = [
  ["ffmpeg", "-i", "{tmp:out/square.mp4}", "-vf", "scale=in_color_matrix=bt709:in_range=auto:flags=accurate_rnd+full_chroma_int+bilinear,format=rgb24", "-fps_mode", "passthrough", "{tmp:f%05d.png}"],
]
metric = "double-exposure"
params = { frames = "{tmp:f*.png}", a = "0.12,0.48,0.17,0.07", b = "0.62,0.48,0.17,0.07", ground = "#0a0a12" }
max    = 0.00507

