# Quality cases: `just quality` runs each one and checks its metric against
# its threshold. The fields are documented on quality.Case. Thresholds only
# ever get stricter.

[[case]]
name   = "render-png-dpi"
why    = "Chrome writes no pHYs, so a PNG claims 72 dpi and a printer reads the wrong print size"
files  = { "page.html" = '''<!doctype html><style>html,body{margin:0;background:#1d3557;color:#fff;font:48px sans-serif}</style><p>Render</p>''' }
run    = ["render", "--size", "800x600", "--scale", "1.5", "--png", "{tmp:p.png}", "{tmp:page.html}"]
metric = "dpi"
params = { image = "{tmp:p.png}" }
min    = 143.99
max    = 144.01

[[case]]
name   = "render-large-whole"
why    = "a large screenshot must come back whole; Chrome has cut one short with a valid header and exit 0"
files  = { "page.html" = '''<!doctype html><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#c{position:absolute;right:0;bottom:0;width:40px;height:40px;background:#0c0}</style><img src="photo.jpg"><div id="c"></div>''' }
setup  = [["magick", "-size", "3000x2000", "xc:gray", "-seed", "7", "+noise", "Random", "-blur", "0x1", "-quality", "90", "{tmp:photo.jpg}"]]
run    = ["render", "--size", "6000x5000", "--scale", "2", "--png", "{tmp:p.png}", "{tmp:page.html}"]
metric = "pixel"
params = { image = "{tmp:p.png}", at = "0.999,0.999", color = "#00cc00" }
max    = 0.02

[[case]]
name   = "render-refuses-unverified-size"
why    = "a render beyond the verified size is refused rather than trusted"
files  = { "page.html" = "<p>x</p>" }
run    = ["render", "--size", "8200x8200", "--scale", "2", "--png", "{tmp:p.png}", "{tmp:page.html}"]
exit   = 1
stderr = "verified whole"
absent = ["{tmp:p.png}"]

[[case]]
name   = "render-fail-if"
why    = "a page that rendered its own error text must not become an output"
files  = { "page.html" = '''<p data-source-error style="color:red">could not be read</p>''' }
run    = ["render", "--size", "400x300", "--fail-if", "could not be read", "--png", "{tmp:p.png}", "{tmp:page.html}"]
exit   = 1
stderr = "could not be read"
absent = ["{tmp:p.png}"]

[[case]]
name   = "render-pdf-without-page-rule"
why    = "without a matching @page Chrome prints Letter and drops the rest of the artboard"
files  = { "page.html" = "<p>no page rule</p>" }
run    = ["render", "--size", "1200x896", "--pdf", "{tmp:p.pdf}", "{tmp:page.html}"]
exit   = 1
stderr = "@page"
absent = ["{tmp:p.pdf}"]

[[case]]
name   = "press-clean-master"
why    = "a Chrome PDF with text, a photo and brand colours presses to outlined CMYK that passes its own soft proof"
files  = { "page.html" = '''<!doctype html><style>@page{size:1200px 896px;margin:0}html,body{margin:0;width:1200px;height:896px}body{background:#fdfcf1;font:bold 96px sans-serif;color:#062d5f}img{width:600px;height:400px;display:block}.bar{position:absolute;bottom:0;width:100%;height:100px;background:#f7a81b;color:#062d5f;font-size:40px}</style><p>Sample heading</p><img src="photo.jpg"><div class="bar">Footer text, 1 Example St</div>''' }
setup  = [
  ["magick", "-size", "1200x800", "gradient:#c9a27e-#35606b", "-seed", "7", "-attenuate", "0.3", "+noise", "Gaussian", "-quality", "92", "{tmp:photo.jpg}"],
  ["plate", "render", "--size", "1200x896", "--pdf", "{tmp:src.pdf}", "{tmp:page.html}"],
]
run    = ["press", "--icc", "{asset:Coated_Fogra39L_VIGC_300.icc}", "--region", "0,0.88,1,0.12:0.06", "{tmp:src.pdf}", "{tmp:press.pdf}"]
stdout = "CMYK only"

[[case]]
name   = "diff-ignores-shift"
why    = "a 4 px vertical shift must not read as a broken page"
setup  = [
  ["magick", "-size", "800x1200", "xc:gray", "-seed", "3", "+noise", "Random", "{tmp:a.png}"],
  ["magick", "{tmp:a.png}", "-background", "white", "-splice", "0x4", "-gravity", "south", "-chop", "0x4", "{tmp:b.png}"],
]
run    = ["diff", "--threshold", "1", "{tmp:a.png}", "{tmp:b.png}"]
stdout = "best fit at +4px"

[[case]]
name   = "diff-catches-change"
why    = "a real block change must fail the threshold"
setup  = [
  ["magick", "-size", "800x1200", "xc:gray", "-seed", "3", "+noise", "Random", "{tmp:a.png}"],
  ["magick", "{tmp:a.png}", "-fill", "red", "-draw", "rectangle 100,100 400,500", "{tmp:b.png}"],
]
run    = ["diff", "--threshold", "5", "{tmp:a.png}", "{tmp:b.png}"]
exit   = 1
stdout = "OVER"

[[case]]
name   = "qr-decodes"
why    = "the code must decode to exactly the text given"
files  = { "page.html" = '''<!doctype html><style>html,body{margin:0;background:#fff}img{display:block;width:137px;margin:40px}</style><img src="qr.svg">''' }
run    = ["qr", "--fg", "062D5F", "-o", "{tmp:qr.svg}", "https://example.org/sample"]
post   = [["plate", "render", "--size", "400x400", "--scale", "1.5", "--png", "{tmp:qr.png}", "{tmp:page.html}"]]
metric = "qr-decodes"
params = { image = "{tmp:qr.png}", text = "https://example.org/sample" }
min    = 1

[[case]]
name   = "grade-apply-identity-colour"
why    = "an identity CLUT must leave colour unchanged"
setup  = [
  ["magick", "-size", "600x400", "xc:gray", "-seed", "5", "+noise", "Random", "(", "-size", "600x400", "xc:black", "-fill", "white", "-draw", "circle 300,200 300,20", "-blur", "0x6", ")", "-alpha", "off", "-compose", "CopyOpacity", "-composite", "{tmp:in.png}"],
  ["magick", "hald:8", "{tmp:id.png}"],
]
run    = ["grade", "apply", "--clut", "{tmp:id.png}", "{tmp:in.png}", "{tmp:out.png}"]
metric = "rmse"
params = { a = "{tmp:in.png}", b = "{tmp:out.png}" }
max    = 0.002

[[case]]
name   = "grade-apply-keeps-alpha"
why    = "-hald-clut on RGBA returns an opaque rectangle; apply must keep the source's alpha"
setup  = [
  ["magick", "-size", "600x400", "xc:gray", "-seed", "5", "+noise", "Random", "(", "-size", "600x400", "xc:black", "-fill", "white", "-draw", "circle 300,200 300,20", "-blur", "0x6", ")", "-alpha", "off", "-compose", "CopyOpacity", "-composite", "{tmp:in.png}"],
  ["magick", "hald:8", "{tmp:id.png}"],
]
run    = ["grade", "apply", "--clut", "{tmp:id.png}", "{tmp:in.png}", "{tmp:out.png}"]
metric = "rmse"
params = { a = "{tmp:in.png}", b = "{tmp:out.png}", channels = "alpha" }
max    = 0.0

[[case]]
name   = "grade-apply-converts-to-srgb"
why    = "fit builds its table from sRGB frames; apply must read a Display P3 source in sRGB too, keeping its 16 bits and alpha, or the table meets P3 values"
setup  = [
  ["magick", "-size", "600x400", "gradient:red-blue", "(", "-size", "400x600", "gradient:lime-black", "-rotate", "90", ")", "-compose", "Blend", "-define", "compose:args=50", "-composite", "(", "-size", "600x400", "xc:black", "-fill", "white", "-draw", "circle 300,200 300,20", "-blur", "0x6", ")", "-alpha", "off", "-compose", "CopyOpacity", "-composite", "-depth", "16", "-profile", "{asset:DisplayP3-v4.icc}", "{tmp:in.png}"],
  ["magick", "{tmp:in.png}", "-profile", "{asset:sRGB-v4.icc}", "{tmp:truth.png}"],
  ["magick", "hald:8", "{tmp:id.png}"],
]
run    = ["grade", "apply", "--clut", "{tmp:id.png}", "{tmp:in.png}", "{tmp:out.png}"]
metric = "rmse"
params = { a = "{tmp:out.png}", b = "{tmp:truth.png}" }
max    = 0.0005

[[case]]
name   = "cutout-hair-over-foliage"
why    = "the coarse mask swallows ivy behind flyaway hair, deep enough that a narrow trimap band marks it sure subject; composited on navy it reads as a green fringe"
run    = ["cutout", "{asset:portrait-ivy.jpg}", "{tmp:cut.png}"]
metric = "green-fringe"
params = { image = "{tmp:cut.png}", region = "0.17,0,0.57,0.58", bg = "#062d5f" }
max    = 0.00082

[[case]]
name   = "cutout-hair-over-foliage-birefnet"
why    = "the Linux default coarse mask must reach the same edge quality"
run    = ["cutout", "--coarse", "birefnet", "{asset:portrait-ivy.jpg}", "{tmp:cut.png}"]
metric = "green-fringe"
params = { image = "{tmp:cut.png}", region = "0.17,0,0.57,0.58", bg = "#062d5f" }
max    = 0.00081

[[case]]
name   = "cutout-sleeve-not-seethrough"
why    = "a trimap band wide enough to reach background deep inside the coarse mask turned a grey sleeve over pale bark 24% see-through on full-resolution tiles"
run    = ["cutout", "{asset:portrait-foliage.jpg}", "{tmp:cut.png}"]
metric = "seethrough"
params = { image = "{tmp:cut.png}", solid = "0.183,0.547 0.243,0.457 0.283,0.415 0.298,0.427 0.258,0.487 0.258,0.554 0.313,0.607 0.353,0.712 0.363,0.832 0.298,0.839 0.338,0.689 0.273,0.629 0.193,0.577" }
max    = 0.001

[[case]]
name   = "cutout-chin-not-seethrough"
why    = "dark hair across a chin reads as a gap to a wide band; a context band of 11 instead of 12 punched a 25% see-through hole there"
run    = ["cutout", "{asset:portrait-foliage.jpg}", "{tmp:cut.png}"]
metric = "seethrough"
params = { image = "{tmp:cut.png}", solid = "0.565,0.47 0.645,0.47 0.645,0.525 0.565,0.525" }
max    = 0.0019

[[case]]
name   = "cutout-dress-not-seethrough"
why    = "a silver-green dress and bare arm in front of ivy must stay opaque when the band reaches deep into the coarse mask"
run    = ["cutout", "{asset:portrait-ivy.jpg}", "{tmp:cut.png}"]
metric = "seethrough"
params = { image = "{tmp:cut.png}", solid = "0.18,0.66 0.23,0.60 0.30,0.62 0.47,0.62 0.62,0.72 0.70,0.78 0.74,0.98 0.20,0.98 0.17,0.82" }
max    = 0.001

[[case]]
name   = "cutout-fur-not-seethrough"
why    = "fur over a similar-coloured ground came out see-through with several models"
run    = ["cutout", "--coarse", "birefnet", "{asset:fur-matching-ground.jpg}", "{tmp:cut.png}"]
metric = "seethrough"
params = { image = "{tmp:cut.png}", solid = "0.45,0.40 0.62,0.36 0.84,0.48 0.84,0.82 0.70,0.88 0.52,0.80 0.45,0.58" }
max    = 0.001

[[case]]
name   = "cutout-tiles-match-whole-frame"
why    = "tiling ViTMatte must not change the matte or leave a seam"
setup  = [["magick", "{asset:portrait-foliage.jpg}", "-resize", "x1400", "{tmp:small.jpg}"]]
run    = ["cutout", "--tile", "1024", "{tmp:small.jpg}", "{tmp:tiled.png}"]
post   = [["plate", "cutout", "--tile", "0", "{tmp:small.jpg}", "{tmp:whole.png}"]]
metric = "rmse"
params = { a = "{tmp:tiled.png}", b = "{tmp:whole.png}", channels = "alpha" }
max    = 0.0067

[[case]]
name   = "cutout-refuses-upsample"
why    = "an upsampled cut-out is the artefact print cannot hide"
run    = ["cutout", "--height", "99999", "{asset:portrait-foliage.jpg}", "{tmp:cut.png}"]
exit   = 1
stderr = "never upsampled"
absent = ["{tmp:cut.png}"]

[[case]]
name   = "cutout-no-foreground"
why    = "a frame with no subject must fail, not produce an empty or random matte"
setup  = [["magick", "-size", "800x600", "xc:#7f7f7f", "{tmp:flat.png}"]]
run    = ["cutout", "--coarse", "birefnet", "{tmp:flat.png}", "{tmp:cut.png}"]
exit   = 1
stderr = "no foreground"
absent = ["{tmp:cut.png}"]

[[case]]
name   = "cutout-no-foreground-colour"
why    = "BiRefNet calls two thirds of a flat red frame confident foreground; it must still fail"
setup  = [["magick", "-size", "800x600", "xc:#c0392b", "{tmp:flat.png}"]]
run    = ["cutout", "--coarse", "birefnet", "{tmp:flat.png}", "{tmp:cut.png}"]
exit   = 1
stderr = "no foreground"
absent = ["{tmp:cut.png}"]

[[case]]
name   = "cutout-no-foreground-radial"
why    = "a bright radial gradient reads as a glowing disc to BiRefNet; with no object it must fail"
setup  = [["magick", "-size", "800x600", "radial-gradient:white-#333355", "{tmp:radial.png}"]]
run    = ["cutout", "--coarse", "birefnet", "{tmp:radial.png}", "{tmp:cut.png}"]
exit   = 1
stderr = "no foreground"
absent = ["{tmp:cut.png}"]

[[case]]
name   = "cutout-no-foreground-texture"
why    = "a textured wall with no object must fail, not cut out a patch of plaster"
run    = ["cutout", "--coarse", "birefnet", "{asset:flat-ground.jpg}", "{tmp:cut.png}"]
exit   = 1
stderr = "no foreground"
absent = ["{tmp:cut.png}"]

[[case]]
name   = "cutout-small-subject"
why    = "a subject filling 3% of the frame has a soft edge as wide as a large one's, so it is a larger share of its mask; it must still be cut out"
setup  = [["magick", "-size", "2400x1600", "gradient:#6b8f4e-#2f4f2f", "-seed", "2", "-attenuate", "0.6", "+noise", "Gaussian", "-fill", "#d8a882", "-draw", "circle 1500,700 1500,600", "-fill", "#2b3f7a", "-draw", "rectangle 1390,800 1610,1170", "{tmp:small.png}"], ["magick", "-size", "2400x1600", "xc:none", "-fill", "white", "-draw", "circle 1500,700 1500,600", "-draw", "rectangle 1390,800 1610,1170", "{tmp:truth.png}"]]
run    = ["cutout", "{tmp:small.png}", "{tmp:cut.png}"]
metric = "rmse"
params = { a = "{tmp:cut.png}", b = "{tmp:truth.png}", channels = "alpha" }
max    = 0.0042

[[case]]
name   = "cutout-small-subject-birefnet"
why    = "the Linux default coarse mask must accept the same small subject"
setup  = [["magick", "-size", "2400x1600", "gradient:#6b8f4e-#2f4f2f", "-seed", "2", "-attenuate", "0.6", "+noise", "Gaussian", "-fill", "#d8a882", "-draw", "circle 1500,700 1500,600", "-fill", "#2b3f7a", "-draw", "rectangle 1390,800 1610,1170", "{tmp:small.png}"], ["magick", "-size", "2400x1600", "xc:none", "-fill", "white", "-draw", "circle 1500,700 1500,600", "-draw", "rectangle 1390,800 1610,1170", "{tmp:truth.png}"]]
run    = ["cutout", "--coarse", "birefnet", "{tmp:small.png}", "{tmp:cut.png}"]
metric = "rmse"
params = { a = "{tmp:cut.png}", b = "{tmp:truth.png}", channels = "alpha" }
max    = 0.0042

[[case]]
name   = "cutout-wide-subject"
why    = "a 3:1 frame scales its whole-frame context pass by area, not height; the subject must still be cut out to its drawn shape"
setup  = [["magick", "-size", "3600x1200", "gradient:#6b8f4e-#2f4f2f", "-seed", "3", "-attenuate", "0.6", "+noise", "Gaussian", "-fill", "#d8a882", "-draw", "circle 2400,330 2400,230", "-fill", "#2b3f7a", "-draw", "rectangle 2290,430 2510,800", "{tmp:wide.png}"], ["magick", "-size", "3600x1200", "xc:none", "-fill", "white", "-draw", "circle 2400,330 2400,230", "-draw", "rectangle 2290,430 2510,800", "{tmp:truth.png}"]]
run    = ["cutout", "{tmp:wide.png}", "{tmp:cut.png}"]
metric = "rmse"
params = { a = "{tmp:cut.png}", b = "{tmp:truth.png}", channels = "alpha" }
max    = 0.0019

[[case]]
name   = "cutout-subject-fills-frame"
why    = "a subject filling most of the frame is a subject, not an empty frame"
setup  = [["magick", "{asset:fur-matching-ground.jpg}", "-crop", "700x600+650+350", "+repage", "{tmp:tight.png}"]]
run    = ["cutout", "--coarse", "birefnet", "{tmp:tight.png}", "{tmp:cut.png}"]
stdout = "wrote"

[[case]]
name   = "infill-texture"
why    = "a filled hole in plaster must be neither flatter nor grainier than the ground around it"
setup  = [["magick", "-size", "1521x1521", "xc:black", "-fill", "white", "-draw", "circle 760,760 760,610", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{asset:flat-ground.jpg}", "{tmp:out.png}"]
metric = "std-ratio"
params = { a = "{tmp:out.png}", b = "{asset:flat-ground.jpg}", mask = "{tmp:mask.png}", ring = 40 }
min    = 0.8
max    = 1.2

[[case]]
name   = "infill-texture-paper"
why    = "a filled hole in fibred paper must be neither flatter nor grainier than the paper around it"
setup  = [["magick", "-size", "1600x1600", "xc:black", "-fill", "white", "-draw", "circle 800,800 800,650", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{asset:paper-ground.jpg}", "{tmp:out.png}"]
metric = "std-ratio"
params = { a = "{tmp:out.png}", b = "{asset:paper-ground.jpg}", mask = "{tmp:mask.png}", ring = 40 }
min    = 0.8
max    = 1.2

[[case]]
name   = "infill-sky-not-grainy"
why    = "a filled hole in a smooth sky must be neither flatter nor grainier than the sky around it"
setup  = [["magick", "-size", "1500x1500", "xc:black", "-fill", "white", "-draw", "circle 750,750 750,600", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{asset:sky-ground.jpg}", "{tmp:out.png}"]
metric = "std-ratio"
params = { a = "{tmp:out.png}", b = "{asset:sky-ground.jpg}", mask = "{tmp:mask.png}", ring = 40 }
min    = 0.8
max    = 1.1

[[case]]
name   = "infill-edge-bleed"
why    = "a hole 30 px from a strong edge must take the colour of its own ground, not darken toward the edge"
setup  = [["magick", "{asset:flat-ground.jpg}", "(", "-size", "1521x581", "xc:#2b2b2b", ")", "-geometry", "+0+940", "-compose", "multiply", "-composite", "{tmp:edge.png}"], ["magick", "-size", "1521x1521", "xc:black", "-fill", "white", "-draw", "circle 760,760 760,610", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{tmp:edge.png}", "{tmp:out.png}"]
post   = [["magick", "{tmp:out.png}", "-blur", "0x8", "{tmp:a.png}"], ["magick", "{tmp:edge.png}", "-blur", "0x8", "{tmp:b.png}"]]
metric = "rmse"
params = { a = "{tmp:a.png}", b = "{tmp:b.png}", mask = "{tmp:mask.png}" }
max    = 0.014

[[case]]
name   = "infill-edge-bleed-rail"
why    = "a hole 30 px above a dark rail with the same ground below it must take the colour of its own ground, not darken toward the rail"
setup  = [["magick", "{asset:flat-ground.jpg}", "(", "-size", "1521x80", "xc:#2b2b2b", ")", "-geometry", "+0+940", "-compose", "multiply", "-composite", "{tmp:rail.png}"], ["magick", "-size", "1521x1521", "xc:black", "-fill", "white", "-draw", "circle 760,760 760,610", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{tmp:rail.png}", "{tmp:out.png}"]
post   = [["magick", "{tmp:out.png}", "-blur", "0x8", "{tmp:a.png}"], ["magick", "{tmp:rail.png}", "-blur", "0x8", "{tmp:b.png}"]]
metric = "rmse"
params = { a = "{tmp:a.png}", b = "{tmp:b.png}", mask = "{tmp:mask.png}" }
max    = 0.014

[[case]]
name   = "infill-edge-bleed-rail-specks"
why    = "specks in the mask far down a tall frame must not make a hole 30 px above a dark rail darken toward it"
setup  = [["magick", "{asset:flat-ground.jpg}", "(", "+clone", "-flip", ")", "(", "-clone", "0", ")", "-append", "+repage", "(", "-size", "1521x40", "xc:#2b2b2b", ")", "-geometry", "+0+940", "-compose", "multiply", "-composite", "{tmp:rail.png}"], ["magick", "-size", "1521x4563", "xc:black", "-fill", "white", "-draw", "circle 760,760 760,610", "-draw", "point 760,1700", "-draw", "point 760,2500", "-draw", "point 760,3300", "-draw", "point 760,4100", "{tmp:mask.png}"]]
run    = ["infill", "--mask", "{tmp:mask.png}", "{tmp:rail.png}", "{tmp:out.png}"]
post   = [["magick", "{tmp:out.png}", "-blur", "0x8", "{tmp:a.png}"], ["magick", "{tmp:rail.png}", "-blur", "0x8", "{tmp:b.png}"]]
metric = "rmse"
params = { a = "{tmp:a.png}", b = "{tmp:b.png}", mask = "{tmp:mask.png}" }
max    = 0.014

[[case]]
name   = "inpaint-texture"
why    = "LaMa must reconstruct a textured hole close to the original"
setup  = [["magick", "-size", "2000x1330", "xc:black", "-fill", "white", "-draw", "circle 1000,665 1000,545", "{tmp:mask.png}"]]
run    = ["inpaint", "--mask", "{tmp:mask.png}", "{asset:detail-photo.jpg}", "{tmp:out.png}"]
metric = "rmse"
params = { a = "{tmp:out.png}", b = "{asset:detail-photo.jpg}", mask = "{tmp:mask.png}" }
max    = 0.21

[[case]]
name   = "synthesis-forbidden"
why    = "a project that forbids synthesis must never get synthesised pixels"
files  = { "plate.toml" = 'synthesis = "forbid"' }
setup  = [["magick", "-size", "64x64", "xc:white", "{tmp:m.png}"]]
run    = ["infill", "--mask", "{tmp:m.png}", "{tmp:m.png}", "{tmp:out.png}"]
exit   = 1
stderr = "synthesis = \"forbid\""
absent = ["{tmp:out.png}"]

[[case]]
name   = "upscale-beats-resampling"
why    = "a 4x-reduced photo must come back closer than plain resampling brings it"
setup  = [["magick", "{asset:detail-photo.jpg}", "-resize", "25%", "{tmp:small.png}"]]
run    = ["upscale", "{tmp:small.png}", "{tmp:up.png}"]
post   = [["magick", "{tmp:up.png}", "-resize", "2000x1330!", "{tmp:up-fit.png}"], ["magick", "{asset:detail-photo.jpg}", "{tmp:orig.png}"]]
metric = "rmse"
params = { a = "{tmp:up-fit.png}", b = "{tmp:orig.png}" }
max    = 0.076

[[case]]
name   = "upscale-beats-resampling-illustration"
why    = "a 4x-reduced digital painting, line art over flat colour and brushwork, must come back closer than plain resampling brings it"
setup  = [["magick", "{asset:illustration.jpg}", "-resize", "25%", "{tmp:small.png}"]]
run    = ["upscale", "{tmp:small.png}", "{tmp:up.png}"]
post   = [["magick", "{asset:illustration.jpg}", "{tmp:orig.png}"]]
metric = "rmse"
params = { a = "{tmp:up.png}", b = "{tmp:orig.png}" }
max    = 0.021

[[case]]
name   = "upscale-recovers-detail"
why    = "the photo's thread twists and stitch edges must come back in place, not blurred away (Lanczos 0.16) or invented elsewhere"
setup  = [["magick", "{asset:detail-photo.jpg}", "-resize", "25%", "{tmp:small.png}"]]
run    = ["upscale", "{tmp:small.png}", "{tmp:up.png}"]
post   = [["magick", "{tmp:up.png}", "-resize", "2000x1330!", "{tmp:up-fit.png}"], ["magick", "{asset:detail-photo.jpg}", "{tmp:orig.png}"]]
metric = "detail"
params = { a = "{tmp:up-fit.png}", b = "{tmp:orig.png}" }
min    = 0.23

[[case]]
name   = "upscale-recovers-detail-illustration"
why    = "the painting's line art and brush strokes must come back in place, not blurred away (Lanczos 0.45) or redrawn"
setup  = [["magick", "{asset:illustration.jpg}", "-resize", "25%", "{tmp:small.png}"]]
run    = ["upscale", "{tmp:small.png}", "{tmp:up.png}"]
post   = [["magick", "{asset:illustration.jpg}", "{tmp:orig.png}"]]
metric = "detail"
params = { a = "{tmp:up.png}", b = "{tmp:orig.png}" }
min    = 0.50

[[case]]
name   = "upscale-16bit-grey"
why    = "a 16-bit greyscale ramp must keep its tones, not clip toward white"
setup  = [["magick", "-size", "16x128", "gradient:white-black", "-rotate", "90", "-colorspace", "gray", "-depth", "16", "{tmp:grey.png}"]]
run    = ["upscale", "{tmp:grey.png}", "{tmp:up.png}"]
post   = [["magick", "{tmp:up.png}", "-resize", "128x16!", "{tmp:back.png}"], ["magick", "{tmp:grey.png}", "-depth", "8", "PNG24:{tmp:ref.png}"]]
metric = "rmse"
params = { a = "{tmp:back.png}", b = "{tmp:ref.png}" }
max    = 0.001

[[case]]
name   = "upscale-palette-alpha"
why    = "a palette PNG whose transparency is a tRNS chunk must come back with that transparency"
setup  = [["magick", "-size", "64x64", "xc:#c0392b", "-alpha", "set", "-fill", "none", "-draw", "color 0,0 reset", "-fill", "#c0392b", "-draw", "circle 32,32 32,8", "-type", "PaletteAlpha", "{tmp:pal.png}"], ["magick", "{tmp:pal.png}", "-alpha", "extract", "-filter", "Lanczos", "-resize", "400%", "PNG24:{tmp:ref.png}"]]
run    = ["upscale", "{tmp:pal.png}", "{tmp:up.png}"]
post   = [["magick", "{tmp:up.png}", "-alpha", "extract", "PNG24:{tmp:alpha.png}"]]
metric = "rmse"
params = { a = "{tmp:alpha.png}", b = "{tmp:ref.png}" }
max    = 0.0034

[[case]]
name   = "grade-fit-recovers-treatment"
why    = "fit must recover a known colour treatment from a shifted, scaled reference"
setup  = [
  ["magick", "{asset:detail-photo.jpg}", "-resize", "x1200", "(", "+clone", "-fill", "black", "-colorize", "100", "-fill", "white", "-draw", "ellipse %[fx:w/2],%[fx:h/2] %[fx:w/3],%[fx:h/2.3] 0,360", ")", "-alpha", "off", "-compose", "CopyOpacity", "-composite", "{tmp:subject.png}"],
  ["magick", "{tmp:subject.png}", "-modulate", "96,118,98", "-level", "3%,97%", "{tmp:truth.png}"],
  ["magick", "{tmp:truth.png}", "-background", "#ddd", "-flatten", "-resize", "85%", "-gravity", "center", "-extent", "150%x120%", "{tmp:ref.png}"],
]
run    = ["grade", "fit", "--ref", "{tmp:ref.png}", "{tmp:subject.png}", "{tmp:hald.png}"]
post   = [["plate", "grade", "apply", "--clut", "{tmp:hald.png}", "{tmp:subject.png}", "{tmp:graded.png}"]]
metric = "rmse"
params = { a = "{tmp:graded.png}", b = "{tmp:truth.png}", region = "0.25,0.25,0.5,0.5" }
max    = 0.0073

# shrink: the source is the target page rendered at 4.21875x (1080 px, the
# ratio of a 1080 px photo shown at 256 px), and the reference is the same
# page rendered natively at 256 px.

[[case]]
name   = "shrink-matches-native-render"
why    = "a downscale should look as if the artwork had been drawn at the small size: soft filters blur hairlines, sharpening rings, linear-light resampling thins dark lines"
setup  = [
  ["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"],
  ["plate", "render", "--png", "{tmp:ref.png}", "--transparent", "--size", "256x256", "{asset:shrink-target.html}"],
]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}"]
metric = "rmse"
params = { a = "{tmp:o.png}", b = "{tmp:ref.png}" }
max    = 0.0275

[[case]]
name   = "shrink-matches-native-render-2.5x"
why    = "the filter must hold at another ratio, not only the one it was chosen on: Box wins at 4.2x and falls behind at 2.5x"
setup  = [
  ["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "2.5", "{asset:shrink-target.html}"],
  ["plate", "render", "--png", "{tmp:ref.png}", "--transparent", "--size", "256x256", "{asset:shrink-target.html}"],
]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}"]
metric = "rmse"
params = { a = "{tmp:o.png}", b = "{tmp:ref.png}" }
max    = 0.0283

[[case]]
name   = "shrink-keeps-detail"
why    = "RMSE is dominated by tone; the fine strokes of the native render must survive the downscale"
setup  = [
  ["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"],
  ["plate", "render", "--png", "{tmp:ref.png}", "--transparent", "--size", "256x256", "{asset:shrink-target.html}"],
]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}"]
metric = "detail"
params = { a = "{tmp:o.png}", b = "{tmp:ref.png}", sigma = 1.0 }
min    = 0.955

[[case]]
name   = "shrink-keeps-alpha"
why    = "a transparent ground and translucent shapes must keep their coverage through the downscale"
setup  = [
  ["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"],
  ["plate", "render", "--png", "{tmp:ref.png}", "--transparent", "--size", "256x256", "{asset:shrink-target.html}"],
]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}"]
metric = "rmse"
params = { a = "{tmp:o.png}", b = "{tmp:ref.png}", channels = "alpha" }
max    = 0.0147

[[case]]
name   = "shrink-png-size"
why    = "a web PNG must be compressed as far as zlib goes; magick's default settings leave about 15% on flat artwork"
setup  = [["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"]]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}"]
metric = "bytes"
params = { image = "{tmp:o.png}" }
max    = 64000

[[case]]
name   = "shrink-webp-size"
why    = "the WebP is the small option: about a third of the PNG at the default quality"
setup  = [["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"]]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.webp}"]
metric = "bytes"
params = { image = "{tmp:o.webp}" }
max    = 22000

[[case]]
name   = "shrink-webp-loss"
why    = "the lossy WebP must stay close to the lossless PNG of the same shrink; 4:2:0 chroma without sharp YUV smears coloured edges"
setup  = [["plate", "render", "--png", "{tmp:big.png}", "--transparent", "--size", "256x256", "--scale", "4.21875", "{asset:shrink-target.html}"]]
run    = ["shrink", "--fit", "256", "{tmp:big.png}", "{tmp:o.png}", "{tmp:o.webp}"]
post   = [["magick", "{tmp:o.webp}", "PNG32:{tmp:w.png}"]]
metric = "rmse"
params = { a = "{tmp:w.png}", b = "{tmp:o.png}" }
max    = 0.0172

[[case]]
name   = "shrink-refuses-enlarging"
why    = "shrink only ever resamples down; enlarging is upscale's job, and a silent enlargement ships a soft asset"
setup  = [["plate", "render", "--png", "{tmp:small.png}", "--size", "256x256", "{asset:shrink-target.html}"]]
run    = ["shrink", "--fit", "512", "{tmp:small.png}", "{tmp:o.png}"]
exit   = 1
stderr = "never enlarges"
absent = ["{tmp:o.png}"]
